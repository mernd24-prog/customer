name: Deploy Customer Staging

on:
  push:
    branches:
      - development

permissions:
  contents: read

concurrency:
  group: customer-staging
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build staging application
        run: npm run build
        env:
          VITE_API_BASE_URL: https://staging.samglobal1.com
          VITE_API_URL: https://staging.samglobal1.com
          VITE_SITE_URL: https://staging.samglobal1.com

      - name: Configure SSH
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          set -eu

          test -n "$STAGING_SSH_KEY" || {
            echo "ERROR: STAGING_SSH_KEY secret is empty or unavailable"
            exit 1
          }

          test -n "$STAGING_HOST" || {
            echo "ERROR: STAGING_HOST secret is empty or unavailable"
            exit 1
          }

          install -m 700 -d ~/.ssh

          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key

          ssh-keygen -y -f ~/.ssh/staging_key > /dev/null || {
            echo "ERROR: SSH private key is invalid"
            exit 1
          }

          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh-keyscan -T 10 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null || {
            echo "ERROR: Unable to retrieve SSH host key. Check STAGING_HOST and network access."
            exit 1
          }

      - name: Upload build to staging
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -eu

          test -n "$STAGING_HOST" || {
            echo "ERROR: STAGING_HOST secret is empty or unavailable"
            exit 1
          }

          test -n "$STAGING_USER" || {
            echo "ERROR: STAGING_USER secret is empty or unavailable"
            exit 1
          }

          test -f dist/index.html || {
            echo "ERROR: dist/index.html not found"
            exit 1
          }

          echo "Checking SSH connection..."

          ssh -i ~/.ssh/staging_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$STAGING_USER@$STAGING_HOST" \
            'mkdir -p /home/ubuntu/ecommerce/customer/dist-new'

          echo "Uploading staging build..."

          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/staging_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            dist/ \
            "$STAGING_USER@$STAGING_HOST:/home/ubuntu/ecommerce/customer/dist-new/"

          echo "Build uploaded successfully."

      - name: Deploy staging build
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -eu

          test -n "$STAGING_HOST" || {
            echo "ERROR: STAGING_HOST secret is empty or unavailable"
            exit 1
          }

          test -n "$STAGING_USER" || {
            echo "ERROR: STAGING_USER secret is empty or unavailable"
            exit 1
          }

          ssh -i ~/.ssh/staging_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$STAGING_USER@$STAGING_HOST" 'bash -se' <<'REMOTE'
          set -eu

          APP=/home/ubuntu/ecommerce/customer
          NEW="$APP/dist-new"
          BACKUP="$APP/dist-backup-$(date +%Y%m%d-%H%M%S)"

          test -f "$NEW/index.html" || {
            echo "ERROR: Uploaded build is missing index.html"
            exit 1
          }

          if [ -d "$APP/dist" ]; then
            mv "$APP/dist" "$BACKUP"
          fi

          if mv "$NEW" "$APP/dist"; then
            echo "Staging deployment successful."
            echo "Previous build backup: $BACKUP"
          else
            echo "ERROR: Deployment failed. Restoring previous build."

            if [ -d "$BACKUP" ]; then
              mv "$BACKUP" "$APP/dist"
            fi

            exit 1
          fi
          REMOTE
